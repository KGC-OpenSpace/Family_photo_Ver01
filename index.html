<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Photo Player</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}
</style>
</head>

<body>

<video id="player" autoplay muted playsinline></video>

<script>

const playlist = [
    "Ver1_2_CCR.mp4",
    "Family_photo_20261008.mp4"
];

let current = 0;

const player = document.getElementById("player");

function playVideo(index){
    player.src = playlist[index];
    player.load();
    player.play();
}

player.addEventListener("ended", () => {
    current++;
    if(current >= playlist.length){
        current = 0;
    }
    playVideo(current);
});

playVideo(0);

</script>

</body>
</html>
